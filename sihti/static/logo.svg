<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sihti">
  <title>Sihti</title>
  <!-- Z ohjaa DNS-kyselyt portille (I). Estetyt (punaiset) pysähtyvät porttiin, sallittu
       (vihreä) kulkee portin aukosta läpi. Tummassa teemassa kiekolla on vaalea reuna,
       jotta merkki erottuu tummasta taustasta. -->
  <style>
    .disc { fill: #1F3A33; } .rim { fill: none; stroke: none; }
    @media (prefers-color-scheme: dark) { .disc { fill: #22443B; } .rim { stroke: #66B8A5; stroke-width: 1.5; } }
  </style>
  <circle class="disc" cx="32" cy="32" r="31"/>
  <circle class="rim" cx="32" cy="32" r="30.25"/>
  <path d="M12.5 18.5H30L13.5 45.5H31" fill="none" stroke="#F3F5F2" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 11V25M42 39V53" stroke="#8FD1BF" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="35.4" cy="18.5" r="3.6" fill="#F0778B"/>
  <circle cx="35.4" cy="45.5" r="3.6" fill="#F0778B"/>
  <path d="M36 32H46" stroke="#8FD1BF" stroke-width="3.4" stroke-linecap="round" opacity=".6"/>
  <circle cx="50.5" cy="32" r="4.3" fill="#8FD1BF"/>
</svg>
