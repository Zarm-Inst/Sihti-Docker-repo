# Sihti – DNS-suodatin (Zarm Instruments)
#
# Sama tiedosto sopii jokaiselle Raspberry Pi:lle sellaisenaan: koneen nimi luetaan
# isäntäkoneelta ja IP-osoite opitaan automaattisesti, kun käyttöliittymä avataan.
#
# Käynnistys:  docker compose up -d
# Päivitys:    docker compose pull sihti && docker compose up -d sihti
# Loki:        docker compose logs -f sihti
#
# Omaan compose-tiedostoon: kopioi "sihti:"-palvelu services-kohdan alle ja
# "sihti-data:"-rivi tiedoston volumes-kohtaan.
#
# Käyttöliittymä: https://<koneen osoite>:4000/  tai  https://<koneen nimi>.local:4000/

services:
  sihti:
    image: ghcr.io/zarm-inst/sihti-docker-repo:latest
    container_name: sihti
    restart: unless-stopped

    ports:
      - "53:53/udp"         # DNS
      - "53:53/tcp"         # DNS (suuret vastaukset)
      - "4000:4000/tcp"     # käyttöliittymä (HTTPS)

    volumes:
      - sihti-data:/data                        # asetukset, listat, loki ja varmenteet
      - /etc/hostname:/etc/host-hostname:ro     # koneen nimi HTTPS-varmenteeseen
      # Yhteinen varmentaja kaikille laitteille (ks. README), ota käyttöön myös
      # SIHTI_TLS_CA_CERT ja SIHTI_TLS_CA_KEY alempana:
      # - ./sihti-ca:/ca:ro

    environment:
      TZ: Europe/Helsinki
      # Uusi satunnainen 10 merkin salasana jokaisella käynnistyksellä. Se tulostuu
      # kontin lokiin riville "Sihti random password: <salasana>". Uusin salasana:
      #   docker logs sihti 2>/dev/null | grep "random password" | tail -n1 | awk '{print $NF}'
      # "false" = salasana asetetaan käyttöliittymästä ja se säilyy.
      SIHTI_RANDOM_PASSWORD: "true"
      # SIHTI_TLS_CA_CERT: /ca/ca.crt
      # SIHTI_TLS_CA_KEY: /ca/ca.key
      # Valinnaiset asetukset (ympäristömuuttuja voittaa käyttöliittymän asetuksen):
      # SIHTI_UPSTREAMS: "1.1.1.1,9.9.9.9"           # ylävirran DNS-palvelimet
      # SIHTI_LOG_RETENTION_DAYS: "7"                # kyselylokin säilytys

    # Rajoittaa kontin oman lokin kokoa (säästää Pi:n muistikorttia)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Älä lisää "security_opt: no-new-privileges": kontti ajetaan tavallisena
    # käyttäjänä, ja asetus estää sen pääsyn porttiin 53.

volumes:
  sihti-data:
